name: grand_elephants
description: "Grand Elephants - Move With Conviction. Premium bags marketplace and luxury heritage storefront."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  camera: ^0.11.1
  path_provider: ^2.1.5
  lipila_flutter: ^1.0.3
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.2
  flutter_map: ^7.0.2
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  vector_tile_renderer: ^5.2.1
  latlong2: ^0.9.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/grandelephants_icon.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/grandelephants_icon.jpg
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/images/grandelephants_icon.jpg

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/branding/
    - assets/images/
    - assets/products/
