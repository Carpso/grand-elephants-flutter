name: sell_on_app
description: "Sell On App - Premium Marketplace & Luxury Heritage"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.5
  http: ^1.6.0
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  camera: ^0.11.1
  path_provider: ^2.1.5
  lipila_flutter: ^1.0.3
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png
    - assets/icon.png
    - assets/branding/
    - assets/images/
    - assets/products/
